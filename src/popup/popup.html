<!doctype html>
<html lang="zh-CN" data-theme="system">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title data-i18n="extensionName">Headers</title>
    <link rel="stylesheet" href="../shared/base.css">
    <link rel="stylesheet" href="popup.css">
  </head>
  <body>
    <main class="app-shell">
      <div id="mainView">
        <header class="topbar">
          <div class="brand">
            <img class="brand-icon" src="../../assets/icon-32.png" alt="">
            <span class="brand-copy">
              <strong>Headers</strong>
              <span class="muted">/ Request Header Manager</span>
            </span>
          </div>
          <label class="switch">
            <input id="globalEnabled" type="checkbox">
            <span class="switch-track" aria-hidden="true"></span>
            <span data-i18n="globalEnabled">Enable globally</span>
          </label>
        </header>

        <section class="space-section">
          <div class="space-status">
            <strong data-i18n="environmentSpaces">Environments</strong>
            <span id="statusDot" class="status-dot" aria-hidden="true"></span>
            <span id="runtimeStatus" class="runtime-status"></span>
          </div>
          <div class="space-tabs-bar">
            <div id="spaceTabs" class="space-tabs" role="tablist" aria-label="Environments"
              data-i18n-aria-label="environmentSpaces"></div>
            <button id="addSpace" class="small-icon-button" type="button" aria-label="Add environment"
              data-i18n-aria-label="addEnvironment">
              <svg class="icon" viewBox="0 0 16 16" aria-hidden="true">
                <path d="M8 3v10M3 8h10"/>
              </svg>
            </button>
          </div>
        </section>

        <section class="headers-section">
          <div id="headerList" class="header-list" role="tabpanel"></div>
        </section>

        <footer class="footer">
          <button id="addHeader" class="small-icon-button" type="button" aria-label="Add Header"
            data-i18n-aria-label="addHeader">
            <svg class="icon" viewBox="0 0 16 16" aria-hidden="true">
              <path d="M8 3v10M3 8h10"/>
            </svg>
          </button>
          <button id="openSettings" class="settings-button" type="button" aria-label="Open settings"
            data-i18n-aria-label="openSettings">
            <span data-i18n="settings">Settings</span>
            <svg class="icon" viewBox="0 0 16 16" aria-hidden="true">
              <path
                d="M6.6 2.5h2.8l.4 1.4c.3.1.6.3.9.5l1.4-.4 1.4 2.4-1 1c0 .2.1.4.1.6s0 .4-.1.6l1 1
                  -1.4 2.4-1.4-.4c-.3.2-.6.4-.9.5l-.4 1.4H6.6l-.4-1.4c-.3-.1-.6-.3-.9-.5l-1.4.4
                  -1.4-2.4 1-1A3 3 0 0 1 3.4 8c0-.2 0-.4.1-.6l-1-1L3.9 4l1.4.4c.3-.2.6-.4.9-.5l.4-1.4Z"/>
              <circle cx="8" cy="8" r="2"/>
            </svg>
          </button>
        </footer>
      </div>

      <section id="settingsView" class="settings-view" hidden>
        <header class="settings-header">
          <div class="settings-title">
            <button id="backToMain" class="small-icon-button" type="button" aria-label="Back"
              data-i18n-aria-label="back">
              <svg class="icon" viewBox="0 0 16 16" aria-hidden="true">
                <path d="m9.5 3.5-4.5 4.5 4.5 4.5M5 8h8"/>
              </svg>
            </button>
            <strong data-i18n="settings">Settings</strong>
            <span class="muted" data-i18n="appliesToAllEnvironments">· Applies to all environments</span>
          </div>
          <span id="saveStatus" class="save-status" data-i18n="saved">Saved</span>
        </header>

        <section class="settings-section">
          <div class="inline-heading">
            <strong data-i18n="predefinedHeaderKeys">Predefined Header Keys</strong>
            <span class="muted" data-i18n="manualKeyHint">· You can still enter any other key</span>
          </div>
          <div id="keyList" class="editable-list"></div>
          <button id="addKey" class="text-button" type="button" data-i18n="addKey">＋ Add key</button>
        </section>

        <section class="settings-section">
          <strong data-i18n="appearance">Appearance</strong>
          <div class="appearance-grid">
            <label>
              <span class="field-label" data-i18n="theme">Theme</span>
              <div class="theme-picker">
                <button id="themeToggle" class="field theme-toggle" type="button"
                  aria-label="Theme" aria-haspopup="listbox" aria-expanded="false"
                  aria-controls="themeMenu" data-i18n-aria-label="theme">
                  <span id="themeLabel">System</span>
                </button>
                <div id="themeMenu" class="theme-menu" role="listbox" hidden>
                  <button class="theme-option" type="button" role="option"
                    data-theme-value="system" data-i18n="themeSystem">System</button>
                  <button class="theme-option" type="button" role="option"
                    data-theme-value="light" data-i18n="themeLight">Light</button>
                  <button class="theme-option" type="button" role="option"
                    data-theme-value="dark" data-i18n="themeDark">Dark</button>
                </div>
              </div>
            </label>
            <label>
              <span class="field-label" data-i18n="font">Font</span>
              <input id="fontFamily" class="field" type="text"
                placeholder="ComicShannsMono Nerd Font, Hannotate SC">
            </label>
          </div>
        </section>

        <section class="settings-section">
          <div class="inline-heading">
            <strong data-i18n="ignoredRequestDomains">Ignored request domains</strong>
            <span class="muted" data-i18n="wildcardHint">· Supports * wildcards</span>
          </div>
          <div id="domainList" class="editable-list"></div>
          <button id="addDomain" class="text-button" type="button"
            data-i18n="addIgnoredDomain">＋ Add ignored domain</button>
        </section>
      </section>
    </main>

    <script type="module" src="popup.js"></script>
  </body>
</html>
